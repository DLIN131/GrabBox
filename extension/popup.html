<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>GrabBox</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" alt="" />
      <b>GrabBox</b>
      <span id="st" class="st">檢查中…</span>
    </header>
    <section>
      <div class="h">這個頁面偵測到的影片</div>
      <div id="list" class="list"></div>
      <div id="empty" class="empty">還沒偵測到影片。<br />播放影片後就會出現在這裡。</div>
    </section>
    <section class="opts">
      <label><input type="checkbox" id="overlay" />在影片上顯示「下載此影片」按鈕</label>
      <label><input type="checkbox" id="magnet" />磁力連結、.torrent 連結交給 GrabBox</label>
      <label><input type="checkbox" id="takeover" />接管瀏覽器下載（壓縮檔、影片、安裝檔等）</label>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
